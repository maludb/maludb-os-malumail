# MaluMail — an application from us beside the Business OS kernel. Rendered by the kernel's installer (bin/app_install.php):
# {{APP_FQDN}} = webmail.<domain> (the vhost label is webmail, the catalog key malumail), {{APP_DIR}} = /srv/apps/malumail, the ports from
# config/.env (all five pinned by deploy/ROOT_STEPS.sh step 1 before the first apply).
# Two virtual hosts: the public name for people (the screens under the session, the proxied MCP servers, the health check), and a loopback
# port for the kernel's actions server and approval replays.
#
# THE PUBLIC ALLOW-LIST (design §8.1): /sso, /sso/logout, /mcp/records, /mcp/activity, /api/v1/health, and the signed /p/ and /img/
# doors (slice 3) (a signed, per-message, short-lived URL is their authority, no cookie). Everything else is under the session's cookie on
# the same origin. NO WEBHOOK DOOR: MaluMail's webhooks are not used (design §0.2; the mail service holds NOTIFY/IDLE).
# NEVER PROXIED: the mail service (127.0.0.1:{{ML_MAILER_PORT}}) and the image door (127.0.0.1:{{ML_IMAGES_PORT}}) are loopback-only; PHP
# calls them, nobody else does.
#
# THE MAIL BODY (design §6.4): /m/{mailbox}/msg/{message}/body is sent by PHP with its own Content-Security-Policy (sandbox, a nonce'd
# height script, frame-ancestors 'self') and shown in an <iframe sandbox> without allow-same-origin. Nothing here may add a CSP or a
# frame header that would loosen or replace it; X-Frame-Options SAMEORIGIN below is compatible (the frame is this origin's page).
#
# Uploads: a draft's attachment is at most 7 MB (design §14) — PHP's upload limit is set to admit one (8M / 9M, below) — and a message stays
# under MaluMail's submission limit (~9.8 MiB): the handler refuses above either, so the request ceiling here is only a backstop.
# storage/ (draft attachments until sent) is NEVER under the web root.

<VirtualHost *:80>
	ServerName {{APP_FQDN}}
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/malumail-error.log
	CustomLog ${APACHE_LOG_DIR}/malumail-access.log combined
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on
	LimitRequestBody 27262976
	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "SAMEORIGIN"
		Header always set Referrer-Policy "same-origin"
	</IfModule>

	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
		php_admin_value max_execution_time 60
		php_admin_value memory_limit 256M
		php_admin_value upload_max_filesize 8M
		php_admin_value post_max_size 9M
	</Directory>

	# The two read MCP servers, under the application's name. Host is NOT preserved (the SDK's DNS-rebinding guard checks it against
	# loopback). Bearer auth is the servers' own (a person's token, the tenant's run token, or the kernel's for app_roles and the share).
	ProxyPreserveHost Off
	ProxyPass        /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPassReverse /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPass        /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp
	ProxyPassReverse /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp

	RewriteEngine On
	RewriteRule ^/mcp/(records|activity)(/|$) - [L]

	# Under /api/v1/ only the health check answers (MaluMail has no public records API: clients' own AI tools use the two MCP servers).
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/api/ - [R=404,L]

	# The sign-on receivers.
	RewriteRule ^/sso$ /sso.php [L,QSA]
	RewriteRule ^/sso/logout$ /sso/logout.php [L,QSA]

	# The mailbox's own routes (design §8, §9; the manifest's Conventions) — mirrored in tests/dev_router.php. A route whose file no slice has
	# built yet falls through to the placeholder at the end.
	RewriteRule ^/m/([0-9]+)/?$ /m/$1/v/inbox [R=302,L]
	RewriteCond %{DOCUMENT_ROOT}/m/view.php -f
	RewriteRule ^/m/([0-9]+)/v/([a-z]+)/?$ /m/view.php?mailbox=$1&view=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/m/folder.php -f
	RewriteRule ^/m/([0-9]+)/f/([0-9]+)/?$ /m/folder.php?mailbox=$1&folder=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/m/label.php -f
	RewriteRule ^/m/([0-9]+)/label/([0-9]+)/?$ /m/label.php?mailbox=$1&label=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/m/thread.php -f
	RewriteRule ^/m/([0-9]+)/t/([0-9]+)/?$ /m/thread.php?mailbox=$1&thread=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/m/$3.php -f
	RewriteRule ^/m/([0-9]+)/msg/([A-Za-z0-9_.-]+)/(original|body|raw)$ /m/$3.php?mailbox=$1&message=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/m/draft-files.php -f
	RewriteRule ^/m/([0-9]+)/drafts/([0-9]+)/files$ /m/draft-files.php?mailbox=$1&draft=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/m/compose.php -f
	RewriteRule ^/m/([0-9]+)/drafts/([0-9]+)/?$ /m/compose.php?mailbox=$1&draft=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/m/person.php -f
	RewriteRule ^/m/([0-9]+)/people/([^/]+)$ /m/person.php?mailbox=$1&correspondent=$2 [B,L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/m/identity-form.php -f
	RewriteRule ^/m/([0-9]+)/identities/new$ /m/identity-form.php?mailbox=$1 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/m/identity-form.php -f
	RewriteRule ^/m/([0-9]+)/identities/([0-9]+)/edit$ /m/identity-form.php?mailbox=$1&identity=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/m/access-new.php -f
	RewriteRule ^/m/([0-9]+)/access/new$ /m/access-new.php?mailbox=$1 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/m/$2.php -f
	RewriteRule ^/m/([0-9]+)/([a-z-]+)/?$ /m/$2.php?mailbox=$1 [L,QSA]
	# The signed doors (slice 3; a signed, per-message, short-lived URL is their authority) and the record picker's sources.
	RewriteCond %{DOCUMENT_ROOT}/p.php -f
	RewriteRule ^/p/([A-Za-z0-9_.-]+)$ /p.php?t=$1 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/img.php -f
	RewriteRule ^/img/([A-Za-z0-9_.-]+)$ /img.php?t=$1 [L,QSA]
	RewriteRule ^/pick/([a-z_]+)$ /pick/index.php?source=$1 [L,QSA]

	# A page of a numbered record (/admin/mailboxes/12/edit) and the canonical URLs: /x/new -> form.php, /x/{id}/edit -> form.php?id=,
	# /x/{id} -> view.php?id=, /x -> x.php or x/index.php.
	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
	# A directory's index (/ and /pick/) is named here, not left to mod_dir (whose internal redirect would meet the fallback below); a
	# manifest screen no slice has built yet falls to the placeholder, which names it and its slice (or answers 404 for a path that is no screen).
	RewriteCond %{DOCUMENT_ROOT}$1index.php -f
	RewriteRule ^(/(?:.+/)?)$ $1index.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
	RewriteRule ^ /placeholder.php [L]
</VirtualHost>

# PHP on the internal port, for the kernel's actions server and approval replays only (no MCP, no signed doors).
Listen 127.0.0.1:{{APP_INTERNAL_PORT}}
<VirtualHost 127.0.0.1:{{APP_INTERNAL_PORT}}>
